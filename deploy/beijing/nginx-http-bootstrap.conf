# HTTP bootstrap only. Public access is awaiting domain filing and valid HTTPS.
# Do not treat this file as completed public deployment.
server {
    listen 80;
    server_name greatdata.asia;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /static/ {
        alias /srv/hyhq-releases/f31c55f/backend/staticfiles/;
        access_log off;
        expires 1d;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
